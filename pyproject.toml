[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvasptools"
version = "0.0.4"
dependencies = [
    "setuptools >= 77.0.3", 
    "py4vasp >= 0.10.1",
    "pymatgen >= 2025.5.1",     
    "matplotlib >= 3.10.1", 
    "numpy >= 1.26.4",     
    "pandas >= 2.2.3", 
    "diptest >= 0.9.0", 
    "vasppy >= 0.7.1.0", 
    ]
requires-python = ">=3.10.14"
authors = [
  {name = "Agnes Katai", email = "agneskatai6@gmail.com"},
]
readme = "README.md"

[tool.setuptools.packages.find]
include = ["pyvasptools*"]